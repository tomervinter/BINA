<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שחזור סיסמה — BINA</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon">
        <img src="img/logo.gif" alt="BINA">
      </div>
      <h1>שכחתי סיסמה</h1>
      <div class="sub">נשלח אליכם קישור לאיפוס הסיסמה</div>
      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox"></div>
      <form id="forgotForm">
        <label>אימייל</label>
        <input type="email" id="email" required>
        <button class="btn btn-primary" type="submit">שליחת קישור לאיפוס</button>
      </form>
      <div style="margin-top:14px;"><a class="link" href="login.html">חזרה להתחברות</a></div>
    </div>
  </div>
  <script src="js/forgot-password.js"></script>
</body>
</html>
