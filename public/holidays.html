<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול חגים — BINA</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main-content">
      <div class="topbar" id="topbarMount"></div>

      <div class="page-title">ניהול חגים</div>
      <div class="page-subtitle">לוח חגים ואירועים המשפיעים על ניתוח המגמות — נערך ידנית ישירות במסך זה, טבלת <b>Holidays</b></div>

      <div class="card">
        <div class="card-title">לוח החגים</div>
        <p class="card-text">הוסיפו כאן את תאריכי החגים לכל השנים הרלוונטיות — ככל שיהיו יותר שנים, כך תובנות ההשוואה השנתית (עלייה/ירידה בחג לעומת אשתקד) יהיו מדויקות יותר.</p>
        <div id="tableContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/confirm-modal.js"></script>
  <script src="js/column-order.js"></script>
  <script src="js/inline-edit-table.js"></script>
  <script src="js/page-holidays.js"></script>
</body>
</html>
