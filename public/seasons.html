<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול עונתיות — רדאר מכירות</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main-content">
      <div class="topbar" id="topbarMount"></div>

      <div class="page-title">ניהול עונתיות</div>
      <div class="page-subtitle">הגדרת תקופות עונתיות המשפיעות על ניתוח המגמות — נערכת ידנית ישירות במסך זה, טבלת <b>Seasonality</b></div>

      <div class="card">
        <div class="card-title">הגדרת העונות</div>
        <p class="card-text">הגדירו כאן טווחי תאריכים לעונות (קיץ, חורף וכד') — משמש להשוואות עונתיות באותו אופן שבו חגים משמשים להשוואה שנתית.</p>
        <div id="tableContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/confirm-modal.js"></script>
  <script src="js/inline-edit-table.js"></script>
  <script>
    initInlineEditTable({
      pageKey: 'seasons',
      apiBase: '/api/seasons',
      addLabel: 'הוספת עונה',
      countLabel: 'עונות',
      fields: [
        { key: 'name', label: 'עונה' },
        { key: 'year', label: 'שנה', type: 'number', default: new Date().getFullYear() },
        { key: 'fromDate', label: 'מתאריך', type: 'date' },
        { key: 'toDate', label: 'עד תאריך', type: 'date' }
      ]
    });
  </script>
</body>
</html>
