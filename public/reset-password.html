<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איפוס סיסמה — BINA</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon">
        <img src="img/logo.gif" alt="BINA">
      </div>
      <h1>איפוס סיסמה</h1>
      <div class="sub">בחרו סיסמה חדשה לחשבון שלכם</div>
      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox"></div>
      <form id="resetForm">
        <label>סיסמה חדשה</label>
        <input type="password" id="newPassword" minlength="8" required>
        <label>אימות סיסמה</label>
        <input type="password" id="confirmPassword" minlength="8" required>
        <button class="btn btn-primary" type="submit">עדכון סיסמה</button>
      </form>
      <div style="margin-top:14px;"><a class="link" href="login.html">חזרה להתחברות</a></div>
    </div>
  </div>
  <script src="js/reset-password.js"></script>
</body>
</html>
