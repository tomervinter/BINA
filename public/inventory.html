<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאי — BINA</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main-content">
      <div class="topbar" id="topbarMount"></div>

      <div class="page-title">טעינת מלאי</div>
      <div class="page-subtitle">מצב המלאי לפי תאריך — טבלת <b>Inventory</b></div>

      <div class="card">
        <div class="card-title">טעינת מלאי</div>
        <p class="card-text">העלו קובץ אקסל (.xlsx) או CSV עם מצב המלאי העדכני לכל מק"ט. נתון זה משמש את מנוע התובנות לבדוק האם ירידה במכר נובעת מהיעדר מלאי ולא מירידה אמיתית בביקוש.</p>
        <div id="uploadWidget"></div>
      </div>

      <div class="card">
        <div class="card-title">מצב המלאי</div>
        <div id="tableContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/confirm-modal.js"></script>
  <script src="js/column-order.js"></script>
  <script src="js/server-table.js"></script>
  <script src="js/upload-widget.js"></script>
  <script src="js/list-page.js"></script>
  <script src="js/page-inventory.js"></script>
</body>
</html>
