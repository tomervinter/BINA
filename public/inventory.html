<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאי — רדאר מכירות</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main-content">
      <div class="topbar" id="topbarMount"></div>

      <div class="card">
        <div class="card-title">טעינת קובץ מלאי (CSV / Excel)</div>
        <div class="upload-row">
          <input type="file" id="csvFile" accept=".csv,.xlsx,.xls">
          <button class="btn" id="uploadBtn">העלאה (מחליף את כל הרשימה)</button>
        </div>
        <div class="status-line" id="uploadStatus"></div>
      </div>

      <div class="card">
        <div class="card-title">מצב מלאי</div>
        <div id="tableContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/server-table.js"></script>
  <script src="js/list-page.js"></script>
  <script>
    function fmtDate(iso) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, '0');
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
    }
    initListPage({
      pageKey: 'inventory',
      apiBase: '/api/inventory',
      exportFilename: 'inventory',
      defaultSort: { field: 'date', dir: 'desc' },
      columns: [
        { key: 'sku', label: 'מק"ט' },
        { key: 'productName', label: 'שם מוצר' },
        { key: 'date', label: 'תאריך', render: (r) => fmtDate(r.date), filterable: false },
        { key: 'stock', label: 'מלאי', filterable: false }
      ]
    });
  </script>
</body>
</html>
