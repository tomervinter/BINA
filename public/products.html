<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוצרים — רדאר מכירות</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main-content">
      <div class="topbar" id="topbarMount"></div>

      <div class="card">
        <div class="card-title">טעינת קובץ מוצרים (CSV)</div>
        <div class="upload-row">
          <input type="file" id="csvFile" accept=".csv,.xlsx,.xls">
          <button class="btn" id="uploadBtn">העלאה (מחליף את כל הרשימה)</button>
        </div>
        <div class="status-line" id="uploadStatus"></div>
      </div>

      <div class="card">
        <div class="card-title">רשימת מוצרים</div>
        <div id="tableContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/table.js"></script>
  <script src="js/list-page.js"></script>
  <script>
    initListPage({
      pageKey: 'products',
      apiBase: '/api/products',
      exportFilename: 'products',
      columns: [
        { key: 'itemCode', label: 'קוד פריט' },
        { key: 'name', label: 'שם פריט' },
        { key: 'type', label: 'טיפוס' },
        { key: 'superType', label: 'טיפוס על' },
        { key: 'department', label: 'מחלקה' },
        { key: 'unit', label: 'יחידת מידה' },
        { key: 'status', label: 'סטטוס' }
      ]
    });
  </script>
</body>
</html>
