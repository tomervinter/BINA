<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מכירות — רדאר מכירות</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main-content">
      <div class="topbar" id="topbarMount"></div>

      <div class="card">
        <div class="card-title">טעינת קובץ מכירות (CSV / Excel)</div>
        <div class="upload-row">
          <input type="file" id="csvFile" accept=".csv,.xlsx,.xls">
          <button class="btn" id="uploadBtn">העלאה (מחליף את כל הרשימה)</button>
        </div>
        <div class="status-line" id="uploadStatus"></div>
      </div>

      <div class="card">
        <div class="card-title">מכירות</div>
        <p style="color:var(--text-muted);font-size:12.5px;margin:0 0 10px;">ניתן לסנן לפי מספר לקוח וקוד פריט; מיון עובד על כל העמודות. הטבלה עמודה-אחר-עמודה כדי לתמוך בכמויות גדולות של נתונים.</p>
        <div id="tableContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/server-table.js"></script>
  <script src="js/list-page.js"></script>
  <script>
    function fmtDate(iso) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, '0');
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
    }
    initListPage({
      pageKey: 'sales',
      apiBase: '/api/sales',
      exportFilename: 'sales',
      defaultSort: { field: 'date', dir: 'desc' },
      columns: [
        { key: 'customerNumber', label: 'מספר לקוח' },
        { key: 'productCode', label: 'קוד פריט' },
        { key: 'date', label: 'תאריך', render: (r) => fmtDate(r.date), filterable: false },
        { key: 'quantity', label: 'מכר כמותי', filterable: false },
        { key: 'revenue', label: 'מכר כספי', filterable: false },
        { key: 'weight', label: 'משקל', filterable: false }
      ]
    });
  </script>
</body>
</html>
