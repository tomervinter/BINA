<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כללי מנוע התובנות — BINA</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main-content">
      <div class="topbar" id="topbarMount"></div>

      <div class="page-title">כללי מנוע התובנות</div>
      <div class="page-subtitle">תיעוד מדויק של כל כלל וסף שלפיו המערכת מייצרת תובנות כרגע.</div>

      <div class="card">
        <ul class="rules-general-list">
          <li>רק לקוחות בסטטוס <b>"פעיל"</b> מניבים תובנות.</li>
          <li>ניתן לשנות רק את הערכים המספריים המודגשים בתוך הטקסט — מבנה הכלל עצמו קבוע.</li>
        </ul>
      </div>

      <div class="card">
        <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
          <span>פירוט הכללים</span>
          <button class="btn btn-ghost btn-sm" id="resetAllBtn" type="button">איפוס כל הכללים לברירת המחדל</button>
        </div>
        <div id="rulesContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/rule-engine-page.js"></script>
  <script>initRuleEnginePage();</script>
</body>
</html>
